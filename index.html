<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CEO Command Center – EatSwada</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
    
    .header { margin-bottom: 24px; border-bottom: 1px solid #1e293b; padding-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; }
    .header h1 { font-size: 24px; font-weight: 900; color: #38bdf8; letter-spacing: -0.5px; }
    .header p { font-size: 13px; color: #94a3b8; margin-top: 4px; font-weight: 600; }
    .role-badge { background: #38bdf8; color: #0f172a; font-size: 10px; font-weight: 900; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px; }

    /* Production Dashboard Stats */
    .dashboard-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .stat-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; text-align: center; display: flex; flex-direction: column; justify-content: center; position: relative;}
    .stat-value { font-size: 22px; font-weight: 900; color: #f8fafc; margin-bottom: 4px; }
    .stat-label { font-size: 10px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-blue { color: #38bdf8; }
    .stat-green { color: #10b981; }
    .stat-orange { color: #f59e0b; }

    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 24px; }
    .card-title { font-size: 16px; font-weight: 900; color: #f8fafc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
    
    .input-field, select { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 14px; font-size: 14px; color: #f8fafc; outline: none; font-family: inherit; font-weight: 600; transition: all 0.2s; }
    .input-field:focus, select:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.1); }

    .btn { width: 100%; background: #38bdf8; color: #0f172a; padding: 16px; border: none; border-radius: 10px; font-size: 15px; font-weight: 900; margin-top: 12px; font-family: inherit; cursor: pointer; transition: 0.2s; }
    .btn-green { background: #10b981; color: #fff; }

    /* Skeleton Loader */
    .skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; display: inline-block; width: 60%; height: 24px;}
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Toast Notifications */
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: #1e293b; border-left: 4px solid #38bdf8; color: #f8fafc; padding: 16px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; animation: slideIn 0.3s ease forwards; }
    .toast.success { border-color: #10b981; }
    .toast.error { border-color: #ef4444; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }

  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div class="header">
    <div>
      <h1>EatSwada Command</h1>
      <p>Master Catalog & Metrics</p>
    </div>
    <span class="role-badge">CEO Node</span>
  </div>

  <div class="dashboard-stats">
    <div class="stat-box">
      <div class="stat-value stat-green" id="metric-revenue"><span class="skeleton"></span></div>
      <div class="stat-label">Total Revenue</div>
    </div>
    <div class="stat-box">
      <div class="stat-value stat-blue" id="metric-orders"><span class="skeleton"></span></div>
      <div class="stat-label">Orders Today</div>
    </div>
    <div class="stat-box">
      <div class="stat-value stat-orange" id="metric-rate"><span class="skeleton"></span></div>
      <div class="stat-label">Success Rate</div>
    </div>
  </div>

  <div class="card" style="border-color: #10b981;">
    <div class="card-title" style="color:#10b981;"><i class="fa-solid fa-store"></i> Step 1: Create New Restaurant</div>
    <div class="input-group"><label>Restaurant Name</label><input type="text" id="resName" class="input-field" placeholder="e.g. Biryani Zone"></div>
    <div class="input-group"><label>Cuisine Type</label><input type="text" id="resCuisine" class="input-field" placeholder="e.g. Biryani, Mughlai"></div>
    <div class="input-group"><label>High-Res Cover Image URL</label><input type="url" id="resImage" class="input-field" placeholder="Paste image link here"></div>
    <button class="btn btn-green" id="btnCreateRes" onclick="createNewRestaurant()">Create Restaurant</button>
  </div>

  <div class="card" style="border-color: #38bdf8;">
    <div class="card-title" style="color:#38bdf8;"><i class="fa-solid fa-plus"></i> Step 2: Inject Food Item</div>
    <div class="input-group">
      <label>1. Assign to Restaurant</label>
      <select id="restaurantSelect" style="flex: 1;"><option value="">Loading restaurants...</option></select>
    </div>
    <div class="input-group"><label>2. Premium Item Name</label><input type="text" id="itemName" class="input-field" placeholder="e.g. Chicken Roll"></div>
    <div class="input-group"><label>3. Default Price (₹)</label><input type="number" id="itemPrice" class="input-field" placeholder="e.g. 80"></div>
    <div class="input-group"><label>4. Dietary Type</label><select id="itemVeg"><option value="true">Vegetarian (Green)</option><option value="false">Non-Vegetarian (Red)</option></select></div>
    <div class="input-group"><label>5. High-Res Image URL</label><input type="url" id="itemImage" class="input-field" placeholder="Paste image link here"></div>
    <button class="btn" id="uploadBtn" onclick="injectMasterItem()">Inject into Live Menu</button>
  </div>

  <script>
    const API_BASE_URL = 'https://eatswada.onrender.com/api';
    function getToken() { return localStorage.getItem('token') || localStorage.getItem('nearbite_token'); }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = type === 'success' ? `<i class="fa-solid fa-check-circle"></i> <span>${message}</span>` : `<i class="fa-solid fa-circle-exclamation"></i> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.animation = 'fadeOut 0.3s ease forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    // FETCH CEO METRICS FROM THE NEW PIPELINE
    async function fetchMetrics() {
      try {
        const res = await fetch(`${API_BASE_URL}/admin/metrics`, { headers: { 'Authorization': `Bearer ${getToken()}` } });
        if (res.ok) {
          const result = await res.json();
          document.getElementById('metric-revenue').innerText = result.data.totalRevenue ? `₹${result.data.totalRevenue}` : '₹0';
          document.getElementById('metric-orders').innerText = result.data.ordersToday || '0';
          document.getElementById('metric-rate').innerText = result.data.successRate ? `${result.data.successRate}%` : '0%';
        } else {
          document.getElementById('metric-revenue').innerText = "Error";
          document.getElementById('metric-orders').innerText = "Error";
          document.getElementById('metric-rate').innerText = "Error";
        }
      } catch (err) {
        showToast("Network Error fetching metrics", "error");
      }
    }

    async function loadRestaurants() {
      try {
        const res = await fetch(`${API_BASE_URL}/admin/restaurants`, { headers: { 'Authorization': `Bearer ${getToken()}` } });
        const result = await res.json();
        if (result.success) {
          const select = document.getElementById('restaurantSelect');
          select.innerHTML = '<option value="">-- Select a Restaurant --</option>';
          result.data.forEach(r => select.innerHTML += `<option value="${r._id}">${r.name}</option>`);
        }
      } catch (err) {}
    }

    async function createNewRestaurant() {
      const name = document.getElementById('resName').value;
      const cuisine = document.getElementById('resCuisine').value;
      const image = document.getElementById('resImage').value || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=800&q=80';
      
      try {
        const res = await fetch(`${API_BASE_URL}/restaurants`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
          body: JSON.stringify({ name: name, cuisine: [cuisine], cuisineDisplay: cuisine, image: image, rating: 4.5, isActive: true })
        });
        if (res.ok) {
           showToast("Restaurant Created!");
           loadRestaurants(); 
        }
      } catch (err) { showToast("Network error", "error"); }
    }

    async function injectMasterItem() {
      const restaurantId = document.getElementById('restaurantSelect').value;
      const name = document.getElementById('itemName').value;
      const price = document.getElementById('itemPrice').value;
      
      try {
        const res = await fetch(`${API_BASE_URL}/admin/menu`, {
          method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
          body: JSON.stringify({ 
            restaurant: restaurantId, restaurantId: restaurantId, 
            name: name, price: Number(price), isVeg: document.getElementById('itemVeg').value === 'true', 
            image: document.getElementById('itemImage').value || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c', 
            category: 'General', inStock: true, isAvailable: true 
          })
        });
        if (res.ok) showToast("Master Item Injected successfully!");
      } catch (err) { showToast("Network error.", "error"); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadRestaurants();
      fetchMetrics();
    });
  </script>
</body>
</html>
